{{define "spectreportal"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectre Portal</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'me-blue':   '#00aaff',
                        'me-dark':   '#0a0e1a',
                        'me-panel':  '#111827',
                        'me-border': '#1e3a5f',
                        'me-accent': '#0d47a1',
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <!-- HTMX -->
    <script defer src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }

        body {
            background-color: #0a0e1a;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Subtle scanline overlay for ambience */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 170, 255, 0.015) 2px,
                rgba(0, 170, 255, 0.015) 4px
            );
            pointer-events: none;
            z-index: 50;
        }

        .tab-btn {
            position: relative;
            padding: 0.75rem 2rem;
            font-size: 0.8125rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            cursor: pointer;
            background: transparent;
            border-left: none;
            border-right: none;
            border-top: none;
        }

        .tab-btn:hover {
            color: #94a3b8;
        }

        .tab-btn.active {
            color: #00aaff;
            border-bottom-color: #00aaff;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #00aaff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00aaff;
        }

        .tab-panel {
            animation: fadeIn 0.15s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0);   }
        }
    </style>
</head>
<body class="min-h-screen text-gray-200"
      x-data="{ activeTab: 'spectre', modalOpen: false }"
      @keydown.escape.window="modalOpen=false">

    <!-- Top bar -->
    <header class="border-b border-me-border bg-me-panel/80 backdrop-blur-sm sticky top-0 z-40">
        <div class="max-w-screen-2xl mx-auto px-6 flex items-center gap-0">

            <!-- Logo / wordmark -->
            <div class="mr-10 flex items-center gap-3 py-3 select-none">
                <svg class="w-6 h-6 text-me-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/>
                </svg>
                <span class="text-sm font-bold tracking-widest uppercase text-me-blue">Spectre Portal</span>
            </div>

            <!-- Tab navigation -->
            <nav class="flex items-stretch h-full">
                <button
                    class="tab-btn"
                    :class="{ active: activeTab === 'spectre' }"
                    @click="activeTab = 'spectre'"
                >
                    Spectre
                </button>
                <button
                    class="tab-btn"
                    :class="{ active: activeTab === 'striketeams' }"
                    @click="activeTab = 'striketeams'"
                >
                    Strike Teams
                </button>
                <button
                    class="tab-btn"
                    :class="{ active: activeTab === 'missionparams' }"
                    @click="activeTab = 'missionparams'"
                >
                    Mission Parameters
                </button>
            </nav>

        </div>
    </header>

    <!-- Tab content area -->
    <main class="max-w-screen-2xl mx-auto px-6 py-8">

        <!-- Spectre tab -->
        <div x-show="activeTab === 'spectre'" x-cloak class="tab-panel">
            <div class="flex items-center gap-3 mb-6">
                <h1 class="text-xl font-semibold tracking-wide text-gray-100">Spectre</h1>
                <span class="text-xs text-me-blue border border-me-border px-2 py-0.5 rounded tracking-widest uppercase">Character Management</span>
            </div>
            <div class="text-gray-500 text-sm">— Content coming soon —</div>
        </div>

        <!-- Strike Teams tab -->
        <div x-show="activeTab === 'striketeams'" x-cloak class="tab-panel">
            <div class="flex items-center gap-3 mb-6">
                <h1 class="text-xl font-semibold tracking-wide text-gray-100">Strike Teams</h1>
                <span class="text-xs text-me-blue border border-me-border px-2 py-0.5 rounded tracking-widest uppercase">Bot Management</span>
            </div>
            <!-- Team management panel: loaded once by HTMX on page load -->
            <div hx-get="/api/teams"
                 hx-trigger="load"
                 hx-swap="outerHTML">
                <div class="text-gray-600 text-xs text-center py-10 select-none">Loading…</div>
            </div>
        </div>

        <!-- Mission Parameters tab -->
        <div x-show="activeTab === 'missionparams'" x-cloak class="tab-panel">
            <div class="flex items-center gap-3 mb-6">
                <h1 class="text-xl font-semibold tracking-wide text-gray-100">Mission Parameters</h1>
                <span class="text-xs text-me-blue border border-me-border px-2 py-0.5 rounded tracking-widest uppercase">Match Settings</span>
            </div>
            <div class="text-gray-500 text-sm">— Content coming soon —</div>
        </div>

    </main>

    <!-- ── Character selector modal ───────────────────────────────────── -->
    <div x-cloak
         x-show="modalOpen"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-50 flex items-center justify-center p-6"
         style="background:rgba(3,6,18,0.85);backdrop-filter:blur(4px)">

        <!-- Click-outside closes -->
        <div class="absolute inset-0" @click="modalOpen=false"></div>

        <!-- Modal panel -->
        <div class="relative z-10 w-full max-w-4xl h-[80vh] flex flex-col
                    bg-[#0d1422] border border-[#1e3a5f] rounded-2xl shadow-2xl p-6"
             @click.stop>
            <div id="modal-body" class="flex flex-col flex-1 min-h-0">
                <!-- HTMX loads character_selector partial here -->
                <div class="text-gray-600 text-xs text-center py-10 select-none">Loading…</div>
            </div>
        </div>
    </div>

</body>
</html>
{{end}}
