{{define "spectre_borrow_char"}}
<div class="flex flex-col h-full"
     x-data="{ activeTab: '{{(index .Groups 0).SubClass}}' }">

    <!-- Header -->
    <div class="flex-shrink-0 mb-3">
        <div class="flex items-center justify-between mb-1">
            <div>
                <h2 class="text-base font-semibold text-gray-100 tracking-wide">Borrow a Power</h2>
                <p class="text-[11px] text-gray-500 mt-0.5">Select a character to see their available powers.</p>
            </div>
            <button class="p-1.5 rounded hover:bg-[#1e3a5f] text-gray-500 hover:text-gray-200
                           transition-colors"
                    @click="modalOpen=false"
                    title="Close">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Subclass tabs -->
        <div class="flex gap-1 border-b border-[#1e3a5f] mt-2">
            {{range .Groups}}
            <button class="relative px-3 py-1.5 text-xs font-semibold tracking-wide rounded-t
                           transition-colors duration-150 focus:outline-none"
                    :class="activeTab === '{{.SubClass}}'
                        ? 'text-[#00aaff] bg-[#0d1829]'
                        : 'text-gray-500 hover:text-gray-300 hover:bg-[#0d1829]/50'"
                    @click="
                        activeTab = '{{.SubClass}}';
                        document.getElementById('borrowchargroup-{{.SubClass}}')
                            .scrollIntoView({block:'start'});
                        document.getElementById('borrow-char-scroll').scrollTop -= 8;
                    ">
                {{.SubClass}}
                <span class="absolute bottom-0 inset-x-0 h-0.5 rounded-full transition-colors duration-150"
                      :class="activeTab === '{{.SubClass}}' ? 'bg-[#00aaff]' : 'bg-transparent'"></span>
            </button>
            {{end}}
        </div>
    </div>

    <!-- Character groups -->
    <div id="borrow-char-scroll" class="overflow-y-auto flex-1 min-h-0 pr-1 space-y-6"
         @scroll="
            const scroll = $el;
            {{range .Groups}}
            const elB{{.SubClass}} = document.getElementById('borrowchargroup-{{.SubClass}}');
            if (elB{{.SubClass}} && elB{{.SubClass}}.getBoundingClientRect().top <= scroll.getBoundingClientRect().top + 40) {
                activeTab = '{{.SubClass}}';
            }
            {{end}}
         ">
        {{range .Groups}}
        <div id="borrowchargroup-{{.SubClass}}">
            <div class="flex items-center gap-3 mb-2">
                <span class="text-[11px] font-bold tracking-widest uppercase text-[#00aaff]/70">{{.SubClass}}</span>
                <div class="flex-1 h-px bg-[#1e3a5f]"></div>
                <span class="text-[10px] text-gray-600">{{len .Characters}}</span>
            </div>

            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-3">
                {{range .Characters}}
                <button class="group relative flex flex-col items-center rounded-lg overflow-hidden
                               border border-[#1e3a5f] bg-[#080c18]
                               hover:border-[#00aaff]/60 hover:bg-[#0d1829]
                               transition-all duration-150 cursor-pointer focus:outline-none
                               focus:border-[#00aaff]"
                        hx-get="/api/spectres/{{$.SpectreID}}/borrowed-power/from-char/{{.ID}}"
                        hx-target="#modal-body"
                        hx-swap="innerHTML"
                        title="{{.Name}}">

                    <div class="w-full aspect-[3/5] bg-gradient-to-b from-[#0d1829] to-[#060a12]
                                overflow-hidden">
                        <img src="{{.PictureURL}}"
                             alt="{{.Name}}"
                             class="w-full h-full object-contain object-bottom
                                    scale-100 group-hover:scale-105 transition-transform duration-200"/>
                    </div>

                    <div class="w-full px-1.5 py-1.5 border-t border-[#1e3a5f] bg-[#0d1422]">
                        <span class="block text-center text-[13px] leading-tight text-gray-400
                                     group-hover:text-[#00aaff] transition-colors truncate">
                            {{.Name}}
                        </span>
                    </div>
                </button>
                {{end}}
            </div>
        </div>
        {{end}}
    </div>

</div>
{{end}}
