{{define "bot_panel"}}
<div class="flex flex-col gap-2 p-1">

    <!-- ── Set Active toggle ── -->
    {{if .TeamID}}
    <div class="flex justify-start">
        <button class="text-[10px] font-semibold tracking-wide uppercase
                       border rounded px-3 py-1.5 transition-all duration-150 cursor-pointer focus:outline-none
                       {{if .TeamActive}}bg-[#0a1a0a] text-green-400 border-green-700 hover:bg-[#0d1b0d] hover:text-green-300{{else}}bg-[#0a0e1a] text-gray-400 border-[#1e3a5f] hover:border-[#00aaff] hover:text-green-400{{end}}"
                hx-post="/api/teams/{{.TeamID}}/active/toggle"
                hx-target="#bot-panel"
                hx-swap="innerHTML"
                title="{{if .TeamActive}}Mark team as inactive{{else}}Set team as active{{end}}">
            {{if .TeamActive}}&#10003; Active{{else}}Set Active{{end}}
        </button>
    </div>
    {{end}}

    <!-- ── Tab strip ── -->
    <div class="flex flex-row flex-wrap items-stretch gap-1">
        {{range .Bots}}
        <div class="relative w-36 flex flex-col rounded-t-lg overflow-hidden
                    border border-b-0 transition-all duration-200 flex-shrink-0"
             :class="$store.botPanel.openBotId === '{{.CardID}}'
                 ? 'border-[#00aaff]/60 bg-[#0d1829] brightness-110'
                 : 'border-[#1e3a5f] bg-[#080c18] hover:border-[#00aaff]/30'">
            <!-- Portrait — toggles expanded card -->
            <button @click="$store.botPanel.openBotId = ($store.botPanel.openBotId === '{{.CardID}}' ? null : '{{.CardID}}')"
                    class="relative w-full overflow-hidden cursor-pointer focus:outline-none"
                    style="height:160px;">
                <img src="{{if .AppearanceCharDef}}{{.AppearanceCharDef.PictureURL}}{{else}}{{.CharDef.PictureURL}}{{end}}"
                     alt="{{.CharDef.Name}}"
                     class="absolute top-0 left-0 w-full object-contain object-top"
                     style="min-height:160px;"/>
            </button>
            <!-- Name -->
            <div class="px-1 py-1 bg-[#0d1422] text-[10px] text-center leading-tight truncate"
                 :class="$store.botPanel.openBotId === '{{.CardID}}' ? 'text-[#00aaff]' : 'text-gray-400'">
                {{.Name}}
            </div>
            <!-- Remove from team -->
            <button class="w-full py-1 text-[9px] font-semibold tracking-widest uppercase
                           bg-[#0a0e1a] text-gray-600 hover:text-red-400 hover:bg-[#1a0808]
                           border-t border-[#1e3a5f] transition-colors focus:outline-none cursor-pointer"
                    hx-delete="/api/teams/{{.TeamID}}/spectres/{{.ID}}"
                    hx-target="#bot-panel"
                    hx-swap="innerHTML"
                    hx-confirm="Remove {{.Name}} from this team?"
                    @click.stop
                    title="Remove from strike team (spectre stays in roster)">
                Remove
            </button>
        </div>
        {{end}}

        <!-- Add Spectre button -->
        <button class="flex flex-col items-center justify-center gap-1 w-36 rounded-xl
                       border-2 border-dashed border-[#1e3a5f]
                       text-[#1e3a5f] hover:text-[#00aaff] hover:border-[#00aaff]
                       transition-all duration-200 cursor-pointer bg-transparent
                       focus:outline-none flex-shrink-0"
                hx-get="/api/teams/{{.TeamID}}/spectres/picker"
                hx-target="#modal-body"
                hx-swap="innerHTML"
                @click="modalOpen=true">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            <span class="text-[10px] tracking-widest uppercase font-semibold">Add</span>
        </button>
    </div>

    <!-- ── Expanded card area ── -->
    {{range .Bots}}
    <div x-show="$store.botPanel.openBotId === '{{.CardID}}'" x-cloak>
        {{template "character_card" .}}
    </div>
    {{end}}

</div>
{{end}}
