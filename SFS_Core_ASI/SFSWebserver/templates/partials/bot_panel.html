{{define "bot_panel"}}
<div class="flex flex-col gap-4 p-1">

    {{range .Bots}}
        {{template "bot_card" .}}
    {{end}}

    <!-- Add Bot button -->
    <button class="w-full flex items-center justify-center gap-3 py-4
                   border-2 border-dashed border-[#1e3a5f] rounded-xl
                   text-[#1e3a5f] hover:text-[#00aaff] hover:border-[#00aaff]
                   transition-all duration-200 cursor-pointer bg-transparent
                   focus:outline-none focus:border-[#00aaff]"
            hx-post="/api/teams/{{.TeamID}}/bots"
            hx-target="#bot-panel"
            hx-swap="innerHTML">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        <span class="text-xs tracking-widest uppercase font-semibold">Add Bot</span>
    </button>

</div>
{{end}}
