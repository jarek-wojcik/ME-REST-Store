{{define "character_selector"}}
<div class="flex flex-col h-full">

    <!-- Selector header -->
    <div class="flex items-center justify-between mb-5 flex-shrink-0">
        <div>
            <h2 class="text-base font-semibold text-gray-100 tracking-wide">Select Character</h2>
            <p class="text-xs text-gray-500 mt-0.5">{{len .Characters}} available</p>
        </div>
        <button class="p-1.5 rounded hover:bg-[#1e3a5f] text-gray-500 hover:text-gray-200
                       transition-colors"
                @click="modalOpen=false"
                title="Close">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Character grid -->
    <div class="overflow-y-auto flex-1 pr-1">
        <div class="grid grid-cols-5 gap-3 sm:grid-cols-6 lg:grid-cols-8">
            {{range .Characters}}
            <button class="group relative flex flex-col items-center rounded-lg overflow-hidden
                           border border-[#1e3a5f] bg-[#080c18]
                           hover:border-[#00aaff]/60 hover:bg-[#0d1829]
                           transition-all duration-150 cursor-pointer focus:outline-none
                           focus:border-[#00aaff]"
                    hx-post="/api/bots/{{$.BotID}}/character/{{.ID}}"
                    hx-target="#bot-card-{{$.BotID}}"
                    hx-swap="outerHTML"
                    @click="modalOpen=false"
                    title="{{.Name}}">

                <!-- Portrait -->
                <div class="w-full aspect-[3/4] bg-gradient-to-b from-[#0d1829] to-[#060a12]
                            overflow-hidden">
                    <img src="{{.PictureURL}}"
                         alt="{{.Name}}"
                         class="w-full h-full object-contain object-bottom
                                scale-110 group-hover:scale-115 transition-transform duration-200"/>
                </div>

                <!-- Name -->
                <div class="w-full px-1.5 py-1.5 border-t border-[#1e3a5f] bg-[#0d1422]">
                    <span class="block text-center text-[10px] leading-tight text-gray-400
                                 group-hover:text-[#00aaff] transition-colors truncate">
                        {{.Name}}
                    </span>
                </div>

            </button>
            {{end}}
        </div>
    </div>

</div>
{{end}}
