{{define "bot_card"}}
<div id="bot-card-{{.Bot.ID}}"
     class="group relative w-full flex flex-row rounded-xl overflow-hidden
            border border-[#1e3a5f] bg-[#080c18]
            hover:border-[#00aaff]/40 transition-all duration-200">

    <!-- Portrait (clickable — opens character selector) -->
    <button class="relative w-36 flex-shrink-0 overflow-hidden
                   bg-gradient-to-b from-[#0d1829] to-[#060a12]
                   cursor-pointer focus:outline-none
                   hover:brightness-110 transition-all duration-200
                   border-r border-[#1e3a5f]"
            hx-get="/api/characters/selector?botId={{.Bot.ID}}"
            hx-target="#modal-body"
            hx-swap="innerHTML"
            @click="modalOpen=true"
            title="Change character">

        <img src="{{.CharDef.PictureURL}}"
             alt="{{.CharDef.Name}}"
             class="w-full h-full object-contain
                    scale-105 transition-transform duration-300 group-hover:scale-110"
             style="min-height:160px;"/>

        <!-- Hover hint -->
        <div class="absolute bottom-2 inset-x-0 flex justify-center
                    opacity-0 group-hover:opacity-100 transition-opacity duration-200">
            <span class="bg-black/70 text-[#00aaff] text-[9px] tracking-widest uppercase
                         px-2 py-0.5 rounded-full">
                Change
            </span>
        </div>
    </button>

    <!-- Right section -->
    <div class="flex flex-col flex-1 min-w-0">

        <!-- Character name bar -->
        <div class="flex items-center justify-between gap-2 px-4 py-2
                    border-b border-[#1e3a5f] bg-[#0d1422]">
            <span class="text-sm font-semibold text-gray-200 truncate"
                  title="{{.CharDef.Name}}">{{.CharDef.Name}}</span>
            <!-- Delete bot -->
            <button class="flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity
                           p-0.5 rounded text-gray-600 hover:text-red-400"
                    hx-delete="/api/bots/{{.Bot.ID}}"
                    hx-target="#bot-card-{{.Bot.ID}}"
                    hx-swap="outerHTML"
                    hx-confirm="Remove this bot?"
                    title="Remove bot">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862
                             a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6
                             m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>

        <!-- Weapon row -->
        <div class="flex items-center gap-4 px-4 py-3 border-b border-[#1e3a5f]/50">
            <span class="text-[10px] font-semibold tracking-widest uppercase
                         text-gray-600 w-14 flex-shrink-0">Weapon</span>

            <!-- Weapon picker button -->
            <button class="group/wpn flex items-center gap-3 rounded-lg
                           border border-[#1e3a5f] bg-[#0a0e1a] px-3 py-2
                           hover:border-[#00aaff]/60 hover:bg-[#0d1829]
                           transition-all duration-150 cursor-pointer focus:outline-none
                           min-w-0 flex-1"
                    hx-get="/api/weapons/selector?botId={{.Bot.ID}}"
                    hx-target="#modal-body"
                    hx-swap="innerHTML"
                    @click="modalOpen=true"
                    title="Change weapon">

                {{if .WeaponDef}}
                    <div class="w-20 h-12 flex-shrink-0 flex items-center justify-center">
                        <img src="{{.WeaponDef.PictureURL}}"
                             alt="{{.WeaponDef.Name}}"
                             class="w-full h-full object-contain
                                    group-hover/wpn:scale-105 transition-transform duration-200"/>
                    </div>
                    <div class="min-w-0">
                        <div class="text-xs font-medium text-gray-300
                                    group-hover/wpn:text-[#00aaff] transition-colors truncate">
                            {{.WeaponDef.Name}}
                        </div>
                        <div class="text-[10px] text-gray-600 truncate">{{.WeaponDef.Category}}</div>
                    </div>
                {{else}}
                    <div class="w-20 h-12 flex-shrink-0 flex items-center justify-center
                                border border-dashed border-[#1e3a5f] rounded">
                        <svg class="w-6 h-6 text-[#1e3a5f] group-hover/wpn:text-[#00aaff]
                                   transition-colors"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                        </svg>
                    </div>
                    <span class="text-xs text-gray-600 group-hover/wpn:text-[#00aaff]
                                 transition-colors">Select weapon…</span>
                {{end}}

            </button>
        </div>

        <!-- Mod slot 1 row -->
        <div class="flex items-center gap-4 px-4 py-2 border-b border-[#1e3a5f]/30">
            <span class="text-[10px] font-semibold tracking-widest uppercase
                         text-gray-600 w-14 flex-shrink-0">Mod 1</span>

            <button class="group/mod1 flex items-center gap-3 rounded-lg
                           border border-[#1e3a5f] bg-[#0a0e1a] px-3 py-1.5
                           hover:border-[#00aaff]/60 hover:bg-[#0d1829]
                           transition-all duration-150 cursor-pointer focus:outline-none
                           min-w-0 flex-1"
                    hx-get="/api/weapon-mods/selector?botId={{.Bot.ID}}&slot=1"
                    hx-target="#modal-body"
                    hx-swap="innerHTML"
                    @click="modalOpen=true"
                    title="Change weapon mod 1">

                {{if .WeaponMod1Def}}
                    <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center">
                        <img src="{{.WeaponMod1Def.PictureURL}}"
                             alt="{{.WeaponMod1Def.Name}}"
                             class="w-full h-full object-contain
                                    group-hover/mod1:scale-105 transition-transform duration-200"/>
                    </div>
                    <div class="min-w-0">
                        <div class="text-xs font-medium text-gray-300
                                    group-hover/mod1:text-[#00aaff] transition-colors truncate">
                            {{.WeaponMod1Def.Name}}
                        </div>
                        <div class="text-[10px] text-gray-600 truncate">{{.WeaponMod1Def.WeaponSlot}}</div>
                    </div>
                {{else}}
                    <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center
                                border border-dashed border-[#1e3a5f] rounded">
                        <svg class="w-4 h-4 text-[#1e3a5f] group-hover/mod1:text-[#00aaff]
                                   transition-colors"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                        </svg>
                    </div>
                    <span class="text-xs text-gray-600 group-hover/mod1:text-[#00aaff]
                                 transition-colors">Select mod…</span>
                {{end}}

            </button>
        </div>

        <!-- Mod slot 2 row -->
        <div class="flex items-center gap-4 px-4 py-2 border-b border-[#1e3a5f]/50">
            <span class="text-[10px] font-semibold tracking-widest uppercase
                         text-gray-600 w-14 flex-shrink-0">Mod 2</span>

            <button class="group/mod2 flex items-center gap-3 rounded-lg
                           border border-[#1e3a5f] bg-[#0a0e1a] px-3 py-1.5
                           hover:border-[#00aaff]/60 hover:bg-[#0d1829]
                           transition-all duration-150 cursor-pointer focus:outline-none
                           min-w-0 flex-1"
                    hx-get="/api/weapon-mods/selector?botId={{.Bot.ID}}&slot=2"
                    hx-target="#modal-body"
                    hx-swap="innerHTML"
                    @click="modalOpen=true"
                    title="Change weapon mod 2">

                {{if .WeaponMod2Def}}
                    <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center">
                        <img src="{{.WeaponMod2Def.PictureURL}}"
                             alt="{{.WeaponMod2Def.Name}}"
                             class="w-full h-full object-contain
                                    group-hover/mod2:scale-105 transition-transform duration-200"/>
                    </div>
                    <div class="min-w-0">
                        <div class="text-xs font-medium text-gray-300
                                    group-hover/mod2:text-[#00aaff] transition-colors truncate">
                            {{.WeaponMod2Def.Name}}
                        </div>
                        <div class="text-[10px] text-gray-600 truncate">{{.WeaponMod2Def.WeaponSlot}}</div>
                    </div>
                {{else}}
                    <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center
                                border border-dashed border-[#1e3a5f] rounded">
                        <svg class="w-4 h-4 text-[#1e3a5f] group-hover/mod2:text-[#00aaff]
                                   transition-colors"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                        </svg>
                    </div>
                    <span class="text-xs text-gray-600 group-hover/mod2:text-[#00aaff]
                                 transition-colors">Select mod…</span>
                {{end}}

            </button>
        </div>

        <!-- Powers section
             Sprite sheet: 384×128, 6 cols × 2 rows of 64×64 cells.
             Each button uses background-image so it IS the cell directly.
             background-size: 384px 128px  (natural sprite size)
             background-position per cell (col * -64px, row * -64px):
               rank1  0px    0px       rank2  -64px  0px      rank3  -128px  0px
               evo4A  -192px 0px       evo4B  -192px -64px
               evo5A  -256px 0px       evo5B  -256px -64px
               evo6A  -320px 0px       evo6B  -320px -64px
        -->
        {{range $i, $pv := .PowerViews}}
        {{if $pv.PowerDef}}
        <div class="flex items-start gap-1.5 px-3 py-1.5 border-b border-[#1e3a5f]/20 last:border-b-0">

            <!-- Power name: vertically centred against the 64px cell height -->
            <span class="text-[9px] text-gray-500 w-[4.5rem] flex-shrink-0 truncate leading-none"
                  style="padding-top:26px;" title="{{$pv.PowerDef.Name}}">{{$pv.PowerDef.Name}}</span>

            <!-- Evolution tree -->
            <div class="flex items-start gap-0.5 flex-shrink-0">

                <!-- ── Rank 1 ── toggle: if rank≥1 → clear, else → set rank 1 -->
                <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                        style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:0px 0px;background-repeat:no-repeat;"
                        hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rank/{{if ge $pv.Rank 1}}0{{else}}1{{end}}"
                        hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 1">
                    {{if lt $pv.Rank 1}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                </button>

                <!-- ── Rank 2 ── -->
                <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                        style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:-64px 0px;background-repeat:no-repeat;"
                        hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rank/2"
                        hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 2">
                    {{if lt $pv.Rank 2}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                </button>

                <!-- ── Rank 3 ── -->
                <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                        style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:-128px 0px;background-repeat:no-repeat;"
                        hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rank/3"
                        hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 3">
                    {{if lt $pv.Rank 3}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                </button>

                <!-- ── Evo rank 4 (A top / B bottom) ── -->
                <div class="flex flex-col gap-0.5">
                    <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                            style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:-192px 0px;background-repeat:no-repeat;"
                            hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rankevo/4/0/A"
                            hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 4 — Evolution A">
                        {{if not (and (ge $pv.Rank 4) (eq $pv.Evo0 "A"))}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                    </button>
                    <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                            style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:-192px -64px;background-repeat:no-repeat;"
                            hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rankevo/4/0/B"
                            hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 4 — Evolution B">
                        {{if not (and (ge $pv.Rank 4) (eq $pv.Evo0 "B"))}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                    </button>
                </div>

                <!-- ── Evo rank 5 (A top / B bottom) ── -->
                <div class="flex flex-col gap-0.5">
                    <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                            style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:-256px 0px;background-repeat:no-repeat;"
                            hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rankevo/5/1/A"
                            hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 5 — Evolution A">
                        {{if not (and (ge $pv.Rank 5) (eq $pv.Evo1 "A"))}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                    </button>
                    <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                            style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:-256px -64px;background-repeat:no-repeat;"
                            hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rankevo/5/1/B"
                            hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 5 — Evolution B">
                        {{if not (and (ge $pv.Rank 5) (eq $pv.Evo1 "B"))}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                    </button>
                </div>

                <!-- ── Evo rank 6 (A top / B bottom) ── -->
                <div class="flex flex-col gap-0.5">
                    <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                            style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:-320px 0px;background-repeat:no-repeat;"
                            hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rankevo/6/2/A"
                            hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 6 — Evolution A">
                        {{if not (and (ge $pv.Rank 6) (eq $pv.Evo2 "A"))}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                    </button>
                    <button class="relative w-16 h-16 rounded-sm focus:outline-none cursor-pointer hover:brightness-125 transition-all flex-shrink-0"
                            style="background-image:url('{{$pv.PowerDef.IconURL}}');background-size:384px 128px;background-position:-320px -64px;background-repeat:no-repeat;"
                            hx-post="/api/bots/{{$.Bot.ID}}/power/{{$pv.SlotIdx}}/rankevo/6/2/B"
                            hx-target="#bot-card-{{$.Bot.ID}}" hx-swap="outerHTML" title="Rank 6 — Evolution B">
                        {{if not (and (ge $pv.Rank 6) (eq $pv.Evo2 "B"))}}<div class="absolute inset-0 bg-[#0a0e1a]/75 pointer-events-none rounded-sm"></div>{{end}}
                    </button>
                </div>

            </div>
        </div>
        {{end}}
        {{end}}

    </div>

</div>
{{end}}
