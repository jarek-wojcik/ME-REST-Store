{{define "bot_card"}}
<div id="bot-card-{{.Bot.ID}}"
     class="group relative w-44 flex flex-col rounded-xl overflow-hidden
            border border-[#1e3a5f] bg-[#080c18]
            hover:border-[#00aaff]/40 transition-all duration-200">

    <!-- Portrait (clickable — opens character selector) -->
    <button class="relative w-full h-52 overflow-hidden bg-gradient-to-b from-[#0d1829] to-[#060a12]
                   cursor-pointer focus:outline-none
                   hover:brightness-110 transition-all duration-200"
            hx-get="/api/characters/selector?botId={{.Bot.ID}}"
            hx-target="#modal-body"
            hx-swap="innerHTML"
            @click="modalOpen=true"
            title="Change character">

        <img src="{{.CharDef.PictureURL}}"
             alt="{{.CharDef.Name}}"
             class="absolute inset-0 w-full h-full object-contain object-bottom
                    scale-110 transition-transform duration-300 group-hover:scale-115"/>

        <!-- Hover overlay hint -->
        <div class="absolute inset-0 flex items-center justify-center
                    bg-[#00aaff]/0 hover:bg-[#00aaff]/10 transition-colors duration-200">
            <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200
                        bg-black/60 rounded-full p-2">
                <svg class="w-5 h-5 text-[#00aaff]" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
        </div>
    </button>

    <!-- Name bar -->
    <div class="flex items-center justify-between gap-1 px-3 py-2
                border-t border-[#1e3a5f] bg-[#0d1422]">
        <span class="text-xs font-medium text-gray-300 truncate leading-tight"
              title="{{.CharDef.Name}}">
            {{.CharDef.Name}}
        </span>

        <!-- Delete bot -->
        <button class="flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity
                       p-0.5 rounded text-gray-600 hover:text-red-400"
                hx-delete="/api/bots/{{.Bot.ID}}"
                hx-target="#bot-card-{{.Bot.ID}}"
                hx-swap="outerHTML"
                hx-confirm="Remove this bot?"
                title="Remove bot">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862
                         a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6
                         m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </button>
    </div>

</div>
{{end}}
