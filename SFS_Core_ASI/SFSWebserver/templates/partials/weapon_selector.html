{{define "weapon_selector"}}
<div class="flex flex-col h-full"
     x-data="{ activeTab: '{{(index .Groups 0).ID}}' }">

    <!-- Selector header -->
    <div class="flex items-center justify-between mb-5 flex-shrink-0">
        <h2 class="text-base font-semibold text-gray-100 tracking-wide">Select Weapon</h2>
        <button class="p-1.5 rounded hover:bg-[#1e3a5f] text-gray-500 hover:text-gray-200
                       transition-colors"
                @click="modalOpen=false"
                title="Close">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Weapon type tabs -->
    <div class="flex-shrink-0 mb-3">
        <div class="flex gap-1 border-b border-[#1e3a5f]">
            {{range .Groups}}
            <button class="relative px-3 py-1.5 text-xs font-semibold tracking-wide rounded-t
                           transition-colors duration-150 focus:outline-none"
                    :class="activeTab === '{{.ID}}'
                        ? 'text-[#00aaff] bg-[#0d1829]'
                        : 'text-gray-500 hover:text-gray-300 hover:bg-[#0d1829]/50'"
                    @click="
                        activeTab = '{{.ID}}';
                        document.getElementById('weapgroup-{{.ID}}')
                            .scrollIntoView({block:'start'});
                        document.getElementById('weapons-scroll').scrollTop -= 8;
                    ">
                {{.Category}}
                <span class="absolute bottom-0 inset-x-0 h-0.5 rounded-full transition-colors duration-150"
                      :class="activeTab === '{{.ID}}' ? 'bg-[#00aaff]' : 'bg-transparent'"></span>
            </button>
            {{end}}
        </div>
    </div>

    <!-- Weapon groups -->
    <div id="weapons-scroll" class="overflow-y-auto flex-1 min-h-0 pr-1 space-y-6"
         @scroll="
            const scroll = $el;
            {{range .Groups}}
            const el{{.ID}} = document.getElementById('weapgroup-{{.ID}}');
            if (el{{.ID}} && el{{.ID}}.getBoundingClientRect().top <= scroll.getBoundingClientRect().top + 40) {
                activeTab = '{{.ID}}';
            }
            {{end}}
         ">
        {{range .Groups}}
        <div id="weapgroup-{{.ID}}">
            <!-- Weapon type heading -->
            <div class="flex items-center gap-3 mb-2">
                <span class="text-[11px] font-bold tracking-widest uppercase text-[#00aaff]/70">{{.Category}}</span>
                <div class="flex-1 h-px bg-[#1e3a5f]"></div>
                <span class="text-[10px] text-gray-600">{{len .Weapons}}</span>
            </div>

            <!-- Grid for this weapon type -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 justify-items-center">
                {{range .Weapons}}
                <button class="group flex flex-col items-center rounded-lg overflow-hidden
                               border border-[#1e3a5f] bg-[#080c18] px-2 py-2
                               hover:border-[#00aaff]/60 hover:bg-[#0d1829]
                               transition-all duration-150 cursor-pointer focus:outline-none
                               focus:border-[#00aaff]"
                        hx-post="{{$.WeaponPostURLBase}}/{{.ID}}"
                        hx-target="#{{$.TargetID}}"
                        hx-swap="outerHTML"
                        @click="modalOpen=false"
                        title="{{.Name}}">

                    <!-- Weapon image -->
                    <div class="w-[7.5rem] h-[7.5rem] bg-gradient-to-b from-[#0d1829] to-[#060a12]
                                rounded overflow-hidden flex items-center justify-center">
                        <img src="{{.PictureURL}}"
                             alt="{{.Name}}"
                             class="w-full h-full object-contain
                                    group-hover:scale-105 transition-transform duration-200"/>
                    </div>

                    <!-- Name -->
                    <div class="mt-2 text-[0.85rem] font-medium text-gray-300 group-hover:text-[#00aaff]
                                 transition-colors text-center leading-tight break-words">
                        {{.Name}}
                    </div>

                </button>
                {{end}}
            </div>
        </div>
        {{end}}
    </div>

</div>
{{end}}
