{{define "consumable_selector"}}
<div class="flex flex-col h-full">

    <!-- Selector header -->
    <div class="flex items-center justify-between mb-5 flex-shrink-0">
        <div>
            <h2 class="text-base font-semibold text-gray-100 tracking-wide">Select {{.CategoryTitle}} Consumable</h2>
            <p class="text-xs text-gray-500 mt-0.5">{{len .Consumables}} available</p>
        </div>
        <button class="p-1.5 rounded hover:bg-[#1e3a5f] text-gray-500 hover:text-gray-200
                       transition-colors"
                @click="modalOpen=false"
                title="Close">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Consumable grid -->
    <div class="overflow-y-auto flex-1 min-h-0 pr-1">
        <div class="grid grid-cols-3 gap-3">

            <!-- Clear slot option -->
            <button class="group flex items-center gap-3 rounded-lg overflow-hidden
                           border border-dashed border-[#1e3a5f] bg-[#080c18] px-3 py-2
                           hover:border-red-500/50 hover:bg-[#1a0c0c]
                           transition-all duration-150 cursor-pointer focus:outline-none
                           col-span-3 justify-center"
                    hx-post="{{$.ConsumableClearURL}}"
                    hx-target="#{{$.TargetID}}"
                    hx-swap="outerHTML"
                    @click="modalOpen=false"
                    title="Clear this consumable slot">
                <svg class="w-4 h-4 text-gray-600 group-hover:text-red-400 transition-colors"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                <span class="text-base text-gray-600 group-hover:text-red-400 transition-colors">Clear slot</span>
            </button>

            {{range .Consumables}}
            <button class="group flex flex-col items-center rounded-lg overflow-hidden
                           border border-[#1e3a5f] bg-[#080c18] px-2 py-3
                           hover:border-[#00aaff]/60 hover:bg-[#0d1829]
                           transition-all duration-150 cursor-pointer focus:outline-none
                           focus:border-[#00aaff]"
                    hx-post="{{$.ConsumablePostURLBase}}/{{.ID}}"
                    hx-target="#{{$.TargetID}}"
                    hx-swap="outerHTML"
                    @click="modalOpen=false"
                    data-tooltip-title="{{.Name}}"
                    data-tooltip-desc="{{.Description}}"
                    @mouseenter="$store.tooltip.show($el.dataset.tooltipTitle, $el.dataset.tooltipDesc.replace(/\\n/g, '\n'), $el)"
                    @mouseleave="$store.tooltip.hide()">

                <!-- Consumable image -->
                <div class="w-[6.5rem] h-[6.5rem] flex-shrink-0 bg-gradient-to-b from-[#0d1829] to-[#060a12]
                            rounded overflow-hidden flex items-center justify-center mb-2">
                    <img src="{{.PictureURL}}"
                         alt="{{.Name}}"
                         class="w-full h-full object-contain
                                group-hover:scale-105 transition-transform duration-200"/>
                </div>

                <!-- Name -->
                <div class="text-base font-medium text-gray-300 group-hover:text-[#00aaff]
                            transition-colors text-center leading-tight line-clamp-2">
                    {{.Name}}
                </div>

            </button>
            {{end}}
        </div>
    </div>

</div>
{{end}}
