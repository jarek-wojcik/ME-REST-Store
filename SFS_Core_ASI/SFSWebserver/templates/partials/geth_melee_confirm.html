{{define "override_bugged_notice"}}
<div class="flex flex-col h-full">

    <!-- Header -->
    <div class="flex-shrink-0 mb-4">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-semibold text-amber-300 tracking-wide">Warning</h2>
            <button class="p-1.5 rounded hover:bg-[#1e3a5f] text-gray-500 hover:text-gray-200
                           transition-colors"
                    @click="modalOpen=false"
                    title="Close">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Body -->
    <div class="flex flex-col flex-1 items-center justify-center gap-6 px-4 text-center">

        <!-- Icon -->
        <div class="w-16 h-16 rounded-full border border-amber-500/30 bg-[#0d1829] flex items-center justify-center">
            <svg class="w-8 h-8 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
            </svg>
        </div>

        <!-- Message -->
        <p class="text-sm text-gray-300 max-w-sm leading-relaxed">
            {{.OverrideMessage}}
        </p>

        <!-- Buttons -->
        <div class="flex gap-4 mt-2">
            <!-- Assign Anyway: posts with force=1 to bypass the warning -->
            <button class="px-6 py-2 rounded-lg border border-amber-500/60 bg-amber-500/10
                           text-amber-300 text-sm font-semibold
                           hover:bg-amber-500/20 hover:border-amber-400
                           transition-colors focus:outline-none"
                    hx-post="{{.ConfirmURL}}"
                    hx-target="#{{.SpectreCardID}}"
                    hx-swap="outerHTML"
                    @click="modalOpen=false">
                Assign Anyway
            </button>

            <!-- Cancel: close modal, do not persist -->
            <button class="px-6 py-2 rounded-lg border border-[#1e3a5f] bg-transparent
                           text-gray-400 text-sm font-semibold
                           hover:border-gray-500 hover:text-gray-200
                           transition-colors focus:outline-none"
                    @click="modalOpen=false">
                Cancel
            </button>
        </div>

    </div>

</div>
{{end}}
