{{define "spectre_borrow_power"}}
<div class="flex flex-col h-full">

    <!-- Header -->
    <div class="flex-shrink-0 mb-4">
        <div class="flex items-center gap-3 mb-3">
            <!-- Back button -->
            <button class="p-1.5 rounded hover:bg-[#1e3a5f] text-gray-500 hover:text-[#00aaff]
                           transition-colors focus:outline-none"
                    hx-get="{{.BackURL}}"
                    hx-target="#modal-body"
                    hx-swap="innerHTML"
                    title="Back to character list">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>

            <!-- Character portrait + name -->
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <div class="w-10 h-14 flex-shrink-0 rounded overflow-hidden bg-[#0d1829]
                            border border-[#1e3a5f]">
                    <img src="{{.CharDef.PictureURL}}"
                         alt="{{.CharDef.Name}}"
                         class="w-full h-full object-contain object-bottom"/>
                </div>
                <div class="min-w-0">
                    <div class="text-[10px] font-bold tracking-widest uppercase text-[#00aaff]/70 mb-0.5">
                        Borrow a Power
                    </div>
                    <h2 class="text-sm font-semibold text-gray-100 truncate">{{.CharDef.Name}}</h2>
                    <div class="text-[10px] text-gray-500">{{.CharDef.SubClass}}</div>
                </div>
            </div>

            <!-- Close button -->
            <button class="flex-shrink-0 p-1.5 rounded hover:bg-[#1e3a5f] text-gray-500
                           hover:text-gray-200 transition-colors"
                    @click="modalOpen=false"
                    title="Cancel">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="h-px bg-[#1e3a5f]"></div>
        <p class="text-[11px] text-gray-500 mt-2">
            Select one power to add to your Spectre's loadout.
            A Spectre can only borrow one power — selecting again will replace it.
        </p>
    </div>

    <!-- Power list -->
    <div class="flex flex-col gap-2 overflow-y-auto flex-1 min-h-0 pr-1">
        {{range .Powers}}
        {{if .}}
        <button class="group flex items-center gap-4 px-4 py-3 rounded-lg
                       border border-[#1e3a5f] bg-[#080c18]
                       hover:border-[#00aaff]/60 hover:bg-[#0d1829]
                       transition-all duration-150 cursor-pointer focus:outline-none w-full text-left"
                hx-post="{{$.PostURLBase}}/{{.ID}}"
                hx-target="#{{$.TargetCardID}}"
                hx-swap="outerHTML"
                @click="modalOpen=false"
                title="Borrow {{.Name}}">

            <!-- Power icon (rank 1 frame = 64×64px tile at offset 0,0) -->
            <div class="w-16 h-16 flex-shrink-0 rounded-sm bg-[#0a0e1a]
                        border border-[#1e3a5f] group-hover:border-[#00aaff]/40 transition-colors"
                 style="background-image:url('{{.IconURL}}');background-size:384px 128px;background-position:0px 0px;background-repeat:no-repeat;">
            </div>

            <!-- Power name -->
            <div class="flex-1 min-w-0">
                <span class="block text-sm font-medium text-gray-300
                             group-hover:text-[#00aaff] transition-colors">
                    {{.Name}}
                </span>
            </div>

            <!-- Arrow indicator -->
            <svg class="w-4 h-4 text-gray-600 group-hover:text-[#00aaff] flex-shrink-0 transition-colors"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
        </button>
        {{end}}
        {{end}}
    </div>

</div>
{{end}}
